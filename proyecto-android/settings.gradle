pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Solo para el motor 7-Zip (JBinding): JitPack no se usa para nada más.
        maven {
            url 'https://jitpack.io'
            content { includeGroup 'com.github.omicronapps' }
        }
    }
}

rootProject.name = 'OptimoPlay'

include ':app'
