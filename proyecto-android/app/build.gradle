plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.optimo.play'
    compileSdk 34

    defaultConfig {
        applicationId 'com.optimo.play'
        // libtorrent4j exige Android 9 (API 28) o superior.
        minSdk 28
        targetSdk 34
        versionCode 36
        versionName '0.8.1'

        // Solo los ABI de moviles reales: recorta el peso de libVLC y libtorrent4j.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    // Firma propia: el workflow de Fusion genera apk-build/debug.keystore la primera vez que compila
    // en el repositorio de ESTE proyecto (igual que Optimo), asi que la clave es estable entre builds.
    signingConfigs {
        debug {
            storeFile file("../apk-build/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        jniLibs {
            // libVLC y libtorrent4j pueden traer ambos libc++_shared.so.
            pickFirsts += ['**/libc++_shared.so']
        }
    }
}

dependencies {
    // Motor de reproduccion: reproduce practicamente cualquier codec/contenedor, subtitulos (libass) incluidos.
    implementation 'org.videolan.android:libvlc-all:3.6.0'

    // Cliente torrent (libtorrent nativo). El artefacto base + un binario por ABI.
    implementation 'org.libtorrent4j:libtorrent4j:2.1.0-39'
    implementation 'org.libtorrent4j:libtorrent4j-android-arm64:2.1.0-39'
    implementation 'org.libtorrent4j:libtorrent4j-android-arm:2.1.0-39'

    // Chromecast (Google Cast). Solo lo usan CastGoogle.kt y CastOpciones.kt.
    implementation 'com.google.android.gms:play-services-cast-framework:21.5.0'
    implementation 'androidx.mediarouter:mediarouter:1.7.0'
}
